# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

# The notebooks are committed with their outputs and are never executed during the build
# (nbsphinx_execute = 'never' in docs/conf.py); heavy dependencies that are not installed
# (torch, gammapy, ...) are mocked by conf.py.
sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

python:
  install:
    - requirements: docs/requirements.txt
